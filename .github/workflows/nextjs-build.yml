name: Build App

on:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: install Dependencies
        run: npm ci

      - name: build application
        run: npm run build

      - name: Success Message
        run: echo "Build Completed"