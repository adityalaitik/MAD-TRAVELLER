name: Next.js CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      #Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      #Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      #install dependency
      - name: Install Dependencies
        run: npm ci

      #Run ESLint
      - name: Run Lint
        run: npm run lint

      #Build next.js
      - name: Build Application
        run: npm run build

      #Success message
      - name: Build Successful
        run: echo "✅ Next.js Build Passed"
