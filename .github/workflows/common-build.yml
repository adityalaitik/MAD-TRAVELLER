name: Common Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout branch
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: install Dependencies
        run: npm ci

      - name: build application
        run: npm run build

      - name: run lint
        run: npm run lint

      - name: Success Message
        run: echo "Build Completed"