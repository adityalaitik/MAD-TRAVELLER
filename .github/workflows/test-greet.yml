name: Test Custom Action

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-greet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Greeting Action
        uses: ./.github/actions/greet
        with:
          username: ${{ github.actor }}
